name: Release

# Pushing a tag such as v2.0.0 builds the plugins for macOS and Windows and attaches them to a
# DRAFT release, which is only public once it has been looked over and published by hand.
# A tag with a hyphen in it, such as v2.0.0-beta.1, is marked as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The default on macOS is a universal binary, for both Apple Silicon and Intel
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ditto keeps the bundles' symbolic links and signatures, which zip does not
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "package/Grisey ${{ github.ref_name }}"
          cd build/Grisey_artefacts/Release
          cp -R VST3/Grisey.vst3 AU/Grisey.component CLAP/Grisey.clap Standalone/Grisey.app "$GITHUB_WORKSPACE/package/Grisey ${{ github.ref_name }}/"
          cd "$GITHUB_WORKSPACE"

          # The linker signs only the binaries, which leaves the bundles failing a strict check of their
          # signatures. There is no developer identity to sign with, so each bundle is signed ad hoc as a
          # whole, which is what Apple Silicon asks for at the least.
          for bundle in "package/Grisey ${{ github.ref_name }}"/Grisey.*; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done

          cp LICENSE.md README.md "package/Grisey ${{ github.ref_name }}/"
          ditto -c -k --keepParent "package/Grisey ${{ github.ref_name }}" "Grisey-${{ github.ref_name }}-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "package/Grisey ${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -Recurse build/Grisey_artefacts/Release/VST3/Grisey.vst3 $folder
          Copy-Item build/Grisey_artefacts/Release/CLAP/Grisey.clap $folder
          Copy-Item build/Grisey_artefacts/Release/Standalone/Grisey.exe $folder
          Copy-Item LICENSE.md, README.md $folder
          Compress-Archive -Path $folder -DestinationPath "Grisey-${{ github.ref_name }}-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Grisey-${{ matrix.name }}
          path: Grisey-${{ github.ref_name }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --draft $prerelease --generate-notes --title "Grisey ${{ github.ref_name }}" \
            Grisey-*.zip
